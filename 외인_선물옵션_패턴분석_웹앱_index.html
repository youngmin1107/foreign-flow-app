<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수급 점수판">
<link rel="manifest" href="manifest.json">
<title>외인 선물·옵션 수급 점수판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:680px;margin:auto;padding:14px 14px 40px}.top{padding:10px 4px 14px}.top h1{font-size:23px;margin:0 0 5px}.top p{font-size:13px;color:#6b7280;margin:0}
.card{background:#fff;border-radius:18px;padding:18px;margin:10px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,select{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:17px;background:#fff}
button{border:0;border-radius:12px;padding:13px 15px;font-weight:800;font-size:15px;cursor:pointer}.primary{width:100%;background:#111827;color:#fff;margin-top:16px}.secondary{background:#eef2ff;color:#3730a3}.danger{background:#fef2f2;color:#b91c1c}
.score{text-align:center;padding:18px}.score .num{font-size:52px;font-weight:900;line-height:1}.badge{display:inline-block;margin-top:10px;padding:8px 13px;border-radius:999px;background:#eef2ff;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f9fafb;border-radius:13px;padding:13px}.metric small{display:block;color:#6b7280;margin-bottom:5px}.metric b{font-size:18px}.good{color:#047857}.warn{color:#b45309}.bad{color:#b91c1c}.muted{color:#6b7280;font-size:13px;line-height:1.5}.history{max-height:330px;overflow:auto}.row{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid #eee;font-size:13px}.row:last-child{border-bottom:0}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.notice{background:#fffbeb;border:1px solid #fde68a;padding:12px;border-radius:12px;font-size:12px;line-height:1.5;color:#92400e}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>외인 선물·옵션 수급 점수판</h1>
    <p>하루 3개 입력 → 누적 데이터로 단기·2~3개월 패턴 분석</p>
  </div>

  <div class="card">
    <label>날짜</label><input id="date" type="date">
    <label>외국인 선물 순매수 (계약)</label><input id="fut" type="number" placeholder="예: 3500">
    <label>외국인 옵션 방향 (-100 ~ +100)</label><input id="opt" type="number" min="-100" max="100" placeholder="매우 약세 -100 / 중립 0 / 매우 강세 +100">
    <label>KOSPI200 종가</label><input id="idx" type="number" step="0.01" placeholder="예: 425.35">
    <button class="primary" onclick="addData()">오늘 데이터 저장 및 분석</button>
  </div>

  <div class="card score">
    <div class="muted">현재 종합 점수</div>
    <div class="num" id="score">—</div>
    <div class="badge" id="direction">데이터를 입력하세요</div>
    <p class="muted" id="confidence"></p>
  </div>

  <div class="card">
    <div class="grid">
      <div class="metric"><small>추가 상승 여력</small><b id="upside">—</b></div>
      <div class="metric"><small>2~3개월 시나리오</small><b id="longterm">—</b></div>
      <div class="metric"><small>유사패턴 20일 상승률</small><b id="rate20">—</b></div>
      <div class="metric"><small>유사패턴 평균 20일</small><b id="avg20">—</b></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px">현재 판단 근거</h3>
    <div id="reason" class="muted">누적 데이터가 쌓이면 과거 유사패턴을 비교합니다.</div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px">누적 데이터 <span id="count" class="muted"></span></h3>
    <div class="actions">
      <button class="secondary" onclick="exportData()">데이터 백업</button>
      <button class="secondary" onclick="document.getElementById('file').click()">백업 복원</button>
      <button class="danger" onclick="clearData()">전체 삭제</button>
    </div>
    <input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)">
    <div id="history" class="history" style="margin-top:10px"></div>
  </div>

  <div class="notice">
    이 앱은 과거 데이터와 현재 입력값의 유사성을 이용한 통계적 참고 도구입니다.
    미래 가격을 보장하거나 투자 결정을 대신하지 않습니다. 표본이 부족하면 판단을 낮은 신뢰도로 표시합니다.
  </div>
</div>

<script>
const KEY="foreign_flow_app_v4";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);

function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function addData(){
  const date=$("date").value, fut=Number($("fut").value), opt=Number($("opt").value), idx=Number($("idx").value);
  if(!date || !Number.isFinite(fut)||!Number.isFinite(opt)||!Number.isFinite(idx)||opt<-100||opt>100){alert("날짜, 선물 순매수, 옵션 방향(-100~100), KOSPI200 종가를 확인하세요.");return;}
  data=data.filter(x=>x.date!==date);
  data.push({date,fut,opt,idx});
  data.sort((a,b)=>a.date.localeCompare(b.date)); save(); render();
  $("fut").value="";$("opt").value="";$("idx").value="";
}
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function sd(a){if(a.length<2)return 1;let m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))||1}
function calcScore(i){
  let prior=data.slice(0,i), fs=prior.map(x=>x.fut);
  let z=fs.length>=5?(data[i].fut-mean(fs))/sd(fs):data[i].fut/5000;
  z=Math.max(-2,Math.min(2,z));
  let f=z/2*55;
  let o=data[i].opt/100*25;
  let ch=0;
  if(i>0) ch=(data[i].idx/data[i-1].idx-1)*100;
  let ic=Math.max(-2,Math.min(2,ch))*10;
  return f+o+ic;
}
function similar(i){
  if(i<30)return [];
  let cur=calcScore(i), priorF=data.slice(0,i).map(x=>x.fut), fsd=sd(priorF);
  let out=[];
  for(let j=10;j<i;j++){
    let d=Math.abs(calcScore(j)-cur)/50 + Math.abs(data[j].opt-data[i].opt)/100 + Math.min(2,Math.abs(data[j].fut-data[i].fut)/fsd)/4;
    let p5=j+5<i? (data[j+5].idx/data[j].idx-1)*100:null;
    let p20=j+20<i? (data[j+20].idx/data[j].idx-1)*100:null;
    let p60=j+60<i? (data[j+60].idx/data[j].idx-1)*100:null;
    if(p20!==null) out.push({d,j,p5,p20,p60});
  }
  out.sort((a,b)=>a.d-b.d);
  return out.slice(0,10);
}
function render(){
  $("count").textContent=`(${data.length}일)`;
  if(!data.length){$("history").innerHTML='<div class="muted">아직 저장된 데이터가 없습니다.</div>';return;}
  const i=data.length-1, s=calcScore(i);
  $("score").textContent=(s>=0?"+":"")+s.toFixed(0);
  let dir=s>=35?"상승 우세":s<=-35?"하락 우세":"혼조";
  $("direction").textContent=dir;
  $("direction").className="badge "+(s>=35?"good":s<=-35?"bad":"warn");
  $("confidence").textContent=data.length<30?`현재 누적 ${data.length}일 — 유사패턴 분석은 30거래일 이후부터 시작합니다.`:`누적 ${data.length}일 — 과거 유사패턴을 함께 반영`;
  let sim=similar(i), r20=sim.filter(x=>x.p20>0).length;
  if(sim.length){
    let rate=r20/sim.length*100, avg20=mean(sim.map(x=>x.p20));
    $("rate20").textContent=rate.toFixed(0)+"%";
    $("avg20").textContent=(avg20>=0?"+":"")+avg20.toFixed(1)+"%";
    $("upside").textContent=rate>=70?"높음":rate>=55?"보통 이상":rate>=45?"제한적":"낮음";
    $("upside").className=rate>=55?"good":rate<45?"bad":"warn";
    let s60=sim.filter(x=>x.p60!==null), rate60=s60.length?mean(s60.map(x=>x.p60>0?1:0))*100:null;
    $("longterm").textContent=rate60===null?"표본 부족":rate60>=65?"상승 시나리오":rate60<=35?"하락 위험":"혼조";
    $("reason").innerHTML=`현재 점수 <b>${s.toFixed(0)}</b>. 과거 가장 가까운 유사 사례 ${sim.length}건에서 20거래일 후 상승한 비율은 <b>${rate.toFixed(0)}%</b>, 평균 변화는 <b>${avg20.toFixed(1)}%</b>입니다.`;
  }else{
    $("rate20").textContent="표본 부족";$("avg20").textContent="—";$("upside").textContent="판단 보류";$("longterm").textContent="표본 부족";
    $("reason").textContent="유사패턴을 계산할 만큼 과거 데이터가 아직 부족합니다.";
  }
  $("history").innerHTML=data.slice().reverse().slice(0,30).map((x,k)=>{
    let ii=data.length-1-k, sc=calcScore(ii);
    return `<div class="row"><span>${x.date}<br>선물 ${x.fut.toLocaleString()} / 옵션 ${x.opt}</span><b>${sc>=0?"+":""}${sc.toFixed(0)}</b></div>`;
  }).join("");
}
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="외인선물옵션_데이터백업.json";a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;data=x;data.sort((a,b)=>a.date.localeCompare(b.date));save();render();alert("복원되었습니다.");}catch{alert("올바른 백업 파일이 아닙니다.");}};r.readAsText(f);
}
function clearData(){if(confirm("누적 데이터를 모두 삭제할까요?")){data=[];save();render();}}
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();
</script>
</body>
</html>
